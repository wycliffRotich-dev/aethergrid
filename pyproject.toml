[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromesh"
# Between releases the tree carries the next version as .dev0. The
# release commit removes the suffix and is the commit that is tagged.
version = "0.7.0.dev0"
description = "Distributed AI Control Plane"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Wycliffe" }
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "psycopg[binary,pool]>=3.2",
    "httpx<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
# app/ has no __init__.py, so without explicit_package_bases mypy finds
# app/application twice, as application and as app.application.
explicit_package_bases = true
files = ["app"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["frontend*"]

[tool.setuptools.package-data]
"app.infrastructure.migrations" = ["versions/*.sql"]

[tool.pytest.ini_options]
markers = [
    "slow: exercises real timing (e.g. connection pool timeouts); excluded from the default fast run",
]

