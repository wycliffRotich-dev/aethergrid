services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: neuromesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: neuromesh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - neuromesh-postgres-data:/var/lib/postgresql/data
      - ./app/infrastructure/repositories/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuromesh -d neuromesh"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 30s

  neuromesh:
    build: .
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NEUROMESH_STORAGE_BACKEND: postgres
      NEUROMESH_DATABASE_URL: postgresql://neuromesh:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/neuromesh
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/livez').getcode() == 200 else 1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  neuromesh-postgres-data:
