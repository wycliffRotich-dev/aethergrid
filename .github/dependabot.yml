# Keeps pinned dependencies visible as pull requests instead of silent
# drift: the base image digests, the postgres digest, GitHub Actions,
# and Python and npm packages. Resolves the digest refresh follow-up
# in ADR 0058.
version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A Python minor bump changes what requires-python, CI and the
      # image agree on. Take it deliberately, not as a bot PR.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Postgres major upgrades need a data migration plan.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /integrations/resilient_client
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint 8.71 supports typescript below 6.1, so the 7.0 bump
      # fails npm ci with an ERESOLVE peer conflict. Hold the major until the
      # linter supports it, then remove this entry.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
