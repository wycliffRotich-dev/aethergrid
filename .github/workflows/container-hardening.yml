# Asserts the container hardening properties recorded in ADR 0058 and
# ADR 0059, so a later change cannot undo them without failing this job.
name: Container hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Compose refuses to create the database without its secret file
        run: |
          # No secrets/ directory exists yet, so the bind mount for the
          # password file has no source. A scratch project name keeps this
          # from touching the real stack. Only the postgres service is
          # named, so the app image is not built for this check. The
          # failure must name the missing source, so a pull or network
          # error cannot satisfy the check.
          status=0
          out=$(docker compose -p nm-nosecret up --no-start postgres 2>&1) || status=$?
          docker compose -p nm-nosecret down -v >/dev/null 2>&1 || true
          if [ "$status" -eq 0 ]; then
            echo "::error::compose created the database without a secret file"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q "bind source path does not exist"; then
            echo "::error::compose failed, but not because the secret file is missing"
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Start the stack with a generated secret file
        run: |
          mkdir -p secrets
          openssl rand -hex 24 | tr -d '\n' > secrets/postgres_password
          chmod 600 secrets/postgres_password
          sudo chown 10001:10001 secrets/postgres_password
          docker compose up -d --build --wait --wait-timeout 180

      - name: Postgres keeps its restrictions
        run: |
          # Capabilities are compared as a sorted list with any CAP_
          # prefix removed, because Docker versions differ in both. The
          # list is still exact, so adding a capability to the postgres
          # service means changing this step in the same commit.
          id=$(docker compose ps -q postgres)
          check() {
            actual=$(docker inspect "$id" --format "$2")
            if [ "$actual" != "$3" ]; then
              echo "::error::postgres $1: got $actual, expected $3"
              exit 1
            fi
          }
          check "root filesystem read-only" '{{.HostConfig.ReadonlyRootfs}}' 'true'
          check_caps() {
            actual=$(docker inspect "$id" --format "{{range $2}}{{.}}{{println}}{{end}}" | sed -e 's/^CAP_//' -e '/^$/d' | sort | paste -sd, -)
            if [ "$actual" != "$3" ]; then
              echo "::error::postgres $1: got $actual, expected $3"
              exit 1
            fi
          }
          check_caps "CapDrop" .HostConfig.CapDrop 'ALL'
          check_caps "CapAdd" .HostConfig.CapAdd 'CHOWN,DAC_READ_SEARCH,SETGID,SETUID'
          check "SecurityOpt" '{{json .HostConfig.SecurityOpt}}' '["no-new-privileges:true"]'

      - name: App runs as uid 10001 with no effective capabilities
        run: |
          uid=$(docker compose exec -T neuromesh id -u)
          [ "$uid" = "10001" ] || { echo "::error::app runs as uid $uid, expected 10001"; exit 1; }
          cap=$(docker compose exec -T neuromesh sh -c "grep CapEff /proc/1/status" | awk '{print $2}')
          [ "$cap" = "0000000000000000" ] || { echo "::error::CapEff is $cap, expected all zeros"; exit 1; }

      - name: Container is read-only, drops all capabilities, blocks privilege gain
        run: |
          cid=$(docker compose ps -q neuromesh)
          ro=$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$cid")
          drop=$(docker inspect -f '{{json .HostConfig.CapDrop}}' "$cid")
          opt=$(docker inspect -f '{{json .HostConfig.SecurityOpt}}' "$cid")
          [ "$ro" = "true" ] || { echo "::error::ReadonlyRootfs is $ro"; exit 1; }
          [ "$drop" = '["ALL"]' ] || { echo "::error::CapDrop is $drop"; exit 1; }
          echo "$opt" | grep -q 'no-new-privileges' || { echo "::error::SecurityOpt is $opt"; exit 1; }

      - name: App writes nothing to its own filesystem
        run: |
          cid=$(docker compose ps -q neuromesh)
          curl -fsS http://127.0.0.1:8000/livez > /dev/null
          # The file secret is a mount, so docker diff lists its mount points. Only
          # these three exact lines are allowed; any other entry still fails.
          raw=$(docker diff "$cid")
          changes=$(printf '%s\n' "$raw" | grep -vxF -e 'C /run' -e 'A /run/secrets' -e 'A /run/secrets/postgres_password') || [ $? -eq 1 ]
          if [ -n "$changes" ]; then
            echo "::error::unexpected writes to the container filesystem"
            echo "$changes"
            exit 1
          fi

      - name: SIGTERM reaches uvicorn and shutdown is graceful
        run: |
          start=$(date +%s%N)
          docker compose stop neuromesh
          end=$(date +%s%N)
          ms=$(( (end - start) / 1000000 ))
          echo "stop took ${ms} ms"
          [ "$ms" -lt 3000 ] || { echo "::error::docker stop took ${ms} ms, SIGTERM is not reaching the app"; exit 1; }
          docker compose logs neuromesh | grep -q "Application shutdown complete" \
            || { echo "::error::no graceful shutdown line in the logs"; exit 1; }

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
